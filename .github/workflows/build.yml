name: Build backport image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Trusted source branch, tag, or commit SHA (full SHA recommended)
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: paperclip-backport-build
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/everlastingcrown/paperclip-backport

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: everlastingcrown/paperclip
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Resolve source commit
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64
          cache-image: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          cache-binary: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ steps.source.outputs.sha }}
          build-args: |
            PAPERCLIP_BUILD_COMMIT=${{ steps.source.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Summarize image
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          {
            printf 'Source: `everlastingcrown/paperclip@%s`\n\n' "$SOURCE_SHA"
            printf 'Platforms: `linux/amd64`, `linux/arm64`\n\n'
            printf 'Image: `%s:sha-%s`\n\n' "$IMAGE" "$SOURCE_SHA"
            printf 'Digest: `%s`\n\n' "$DIGEST"
            printf 'Pull: `docker pull %s@%s`\n' "$IMAGE" "$DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
