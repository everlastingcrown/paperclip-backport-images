name: Build backport image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Trusted source branch, tag, or commit SHA (full SHA recommended)
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: paperclip-backport-build
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/everlastingcrown/paperclip-backport

jobs:
  source:
    name: Resolve source commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: everlastingcrown/paperclip
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Resolve source commit
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.arch }})
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: everlastingcrown/paperclip
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          cache-binary: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: production
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            PAPERCLIP_BUILD_COMMIT=${{ needs.source.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ needs.source.outputs.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-platform image
    needs: [source, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download image digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          cache-binary: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and inspect image index
        id: manifest
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        working-directory: ${{ runner.temp }}/digests
        shell: bash
        run: |
          set -euo pipefail
          digests=(*)
          if [[ ${#digests[@]} -ne 2 ]]; then
            echo "Expected two architecture digests" >&2
            exit 1
          fi
          sources=()
          for digest in "${digests[@]}"; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            sources+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create --tag "$IMAGE:sha-$SOURCE_SHA" \
            --metadata-file "$RUNNER_TEMP/manifest.json" "${sources[@]}"
          digest=$(jq -er ' .["containerimage.descriptor"].digest' "$RUNNER_TEMP/manifest.json")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$IMAGE@$digest"

      - name: Summarize image
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        shell: bash
        run: |
          {
            printf 'Source: `everlastingcrown/paperclip@%s`\n\n' "$SOURCE_SHA"
            printf 'Platforms: `linux/amd64`, `linux/arm64`\n\n'
            printf 'Image: `%s:sha-%s`\n\n' "$IMAGE" "$SOURCE_SHA"
            printf 'Digest: `%s`\n\n' "$DIGEST"
            printf 'Pull: `docker pull %s@%s`\n' "$IMAGE" "$DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
